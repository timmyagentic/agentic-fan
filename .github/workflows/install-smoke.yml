name: Install from published build artifact

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful macOS DMG workflow run to install
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  install:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: arm64
      - name: Download, install and verify through the same entry point as users
        env:
          GH_TOKEN: ${{ github.token }}
          AGENTICFAN_RUN_ID: ${{ inputs.run_id }}
        run: python packaging/macos/test_install.py --run-id "$AGENTICFAN_RUN_ID"
