name: Repository policy

on:
  pull_request:
    branches: ['codex/apple-silicon-dmg']
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: repository-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  policy:
    name: Repository policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate version and bilingual PR changelogs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          APPROVED_MINOR: ${{ contains(github.event.pull_request.labels.*.name, 'version:minor-approved') }}
          APPROVED_MAJOR: ${{ contains(github.event.pull_request.labels.*.name, 'version:major-approved') }}
        run: |
          set -euo pipefail
          level='patch'
          if [[ "$APPROVED_MINOR" == true && "$APPROVED_MAJOR" == true ]]; then
            echo '::error::Use only one explicitly authorized version-upgrade label'
            exit 1
          fi
          if [[ "$APPROVED_MINOR" == true ]]; then level='minor'; fi
          if [[ "$APPROVED_MAJOR" == true ]]; then level='major'; fi
          released="$(gh release view --repo "$GH_REPO" --json tagName --jq .tagName)"
          python3 scripts/check-repository.py --released-version "$released" \
            --release-level "$level" --base "$PR_BASE" --head "$PR_HEAD"
