[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-mac-fans-control"
version = "0.3.1"
description = "Mac temperature monitoring and bounded fan control with an agent-friendly JSON CLI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
macfan = "macfan.entry:main"

[tool.setuptools.packages.find]
include = ["macfan*"]

[tool.setuptools.package-data]
macfan = ["agent_skill/*.md", "THIRD_PARTY_NOTICES.md"]
