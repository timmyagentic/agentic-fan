[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-fan"
version = "0.4.3"
description = "Mac temperature monitoring and bounded fan control with an agent-friendly JSON CLI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
agenticfan = "agenticfan.entry:main"

[tool.setuptools.packages.find]
include = ["agenticfan*"]

[tool.setuptools.package-data]
agenticfan = ["agent_skill/*.md", "THIRD_PARTY_NOTICES.md"]
